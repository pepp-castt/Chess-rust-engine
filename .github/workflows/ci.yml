name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Perft suite
        run: cargo test --release --test perft
      - name: Build release
        run: cargo build --release
      - name: Bench smoke
        run: ./target/release/chess-rust-engine bench 4
      - name: NNUE train/inference parity (random net, engine vs trainer decode vs float reference)
        run: |
          python3 -m pip install --quiet numpy python-chess
          python3 tools/nnue/parity_check.py --engine ./target/release/chess-rust-engine --n 400
