# x86-64-v2 = SSE4.2 + POPCNT (every x86-64 CPU since ~2009). Without it rustc
# emits a software popcount for `count_ones()`, which the eval and movegen call
# constantly. Measured +4-5% NPS (identical nodes). `make native` still
# overrides this with `-C target-cpu=native` via RUSTFLAGS.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]
